name: Bug
description: Something doesn't work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Paste any error text.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Computer
      options:
        - Windows
        - Mac
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "This kit's release, and VPX's (Windows: Help → About; Mac: the DMG's name)"
      placeholder: rpu-vpx v0.1.0, VPX 10.8.1-5436
    validations:
      required: true
  - type: input
    id: machine
    attributes:
      label: Machine and board rev
      description: "The PinMAME name you used, and your game's RPU_OS_HARDWARE_REV"
      placeholder: startreb, rev 4
  - type: textarea
    id: log
    attributes:
      label: Log
      description: "Start VPX with RPU_PLUGIN_LOG=1 set and paste the RPU lines. No ROM files, please."
      render: text
